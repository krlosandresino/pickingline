<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💻 Consolidador de Picking</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0b0f19; --panel: #1e293b; --accent: #38bdf8; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --border: #334155; --text: #f1f5f9; }
        body, html { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
        .layout { display: flex; flex-direction: column; height: 100vh; }
        .top-container { flex-shrink: 0; z-index: 1000; background: var(--bg); }
        .header-fixed { background: var(--panel); padding: 15px 25px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        .action-container { display: grid; grid-template-columns: 1fr auto auto; gap: 15px; background: rgba(56, 189, 248, 0.07); padding: 10px; border-radius: 8px; border: 1px solid var(--accent); align-items: center; }
        input { padding: 10px; background: #0b0f19; border: 1px solid var(--border); color: white; border-radius: 6px; outline: none; width: 100%; box-sizing: border-box; }
        
        .btn-custom { padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-warning.active { background: transparent; border: 2px solid var(--warning); color: var(--warning); }
        
        .table-header-fixed { background: #1a2233; padding: 0 25px; border-bottom: 2px solid var(--accent); }
        .header-row { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; max-width: 1300px; margin: 0 auto; padding: 15px 20px; }
        .header-row span { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        
        .scroll-area { flex: 1; overflow-y: auto; padding: 0 25px 40px 25px; }
        .table-body-container { background: var(--panel); border-radius: 0 0 12px 12px; border: 1px solid var(--border); width: 100%; max-width: 1300px; margin: 0 auto; }
        .data-row { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; padding: 12px 20px; border-bottom: 1px solid var(--border); align-items: center; font-size: 0.95rem; transition: background 0.2s; }
        .data-row:hover { background: rgba(255,255,255,0.05); }
        .data-row.duplicated { background: rgba(239, 68, 68, 0.15); border-left: 4px solid var(--danger); }
        
        .btn-del { background: var(--danger); border: none; color: white; cursor: pointer; border-radius: 4px; padding: 6px 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .btn-del:hover { background: #dc2626; }
        
        .badge-s1 { background: #3b82f6; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge-s2 { background: #8b5cf6; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
<div class="layout">
    <div class="top-container">
        <div class="header-fixed">
            <div class="header-top">
                <h3 style="margin:0;">CONSOLIDADOR DE PICKING <small style="color:var(--accent)">| Sesión 1 & 2</small></h3>
                <div id="statsCounter" style="font-size: 0.95rem; font-weight: bold; background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 6px; border: 1px solid var(--border);">
                    Registros: <span style="color: white;">0</span> &nbsp;|&nbsp; Duplicados: <span style="color: var(--danger);">0</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-custom btn-del" onclick="deleteAllRecords()" style="padding: 10px 15px;">🗑️ Eliminar Todo</button>
                    <button class="btn-custom btn-outline" onclick="exportToExcel()">📥 Exportar a Excel</button>
                </div>
            </div>
            <div class="action-container">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por código o ubicación..." onkeyup="handleSearch()">
                <button id="btnDuplicates" class="btn-custom btn-warning" onclick="toggleDuplicates()">⚠️ Mostrar Duplicados</button>
            </div>
        </div>
        <div class="table-header-fixed">
            <div class="header-row">
                <span>Ubicación</span>
                <span>Código</span>
                <span>Archivo Origen</span>
                <span>Acción</span>
            </div>
        </div>
    </div>
    <div class="scroll-area">
        <div class="table-body-container" id="tableBody">
            <!-- Los datos se insertarán aquí -->
        </div>
    </div>
</div>

<script>
    // Configuración Sesión 1
    const config1 = { 
        apiKey: "AIzaSyClp2tVcoeIE_ZOedIzP6zyEXEoP9Em0tM", 
        databaseURL: "https://chatpareja-3fbce-default-rtdb.firebaseio.com", 
        projectId: "chatpareja-3fbce" 
    };
    
    // Configuración Sesión 2
    const config2 = { 
        apiKey: "AIzaSyAENxoHkiH5XrW5iOYJl9ci_w8SSYoLw3s", 
        databaseURL: "https://verproductos-40224-default-rtdb.firebaseio.com",
        projectId: "verproductos-40224" 
    };

    // Inicializar ambas aplicaciones de Firebase
    const app1 = firebase.initializeApp(config1, "app1");
    const app2 = firebase.initializeApp(config2, "app2");
    
    const db1 = app1.database();
    const db2 = app2.database();

    let data1 = {};
    let data2 = {};
    let combinedData = [];
    let showDuplicatesOnly = false;
    let searchTerm = "";

    // Escuchar datos de la Sesión 1
    db1.ref('picking_live/stationsData').on('value', (snapshot) => {
        data1 = snapshot.val() || {};
        processData();
    });

    // Escuchar datos de la Sesión 2
    db2.ref('picking_live/stationsData').on('value', (snapshot) => {
        data2 = snapshot.val() || {};
        processData();
    });

    function processData() {
        combinedData = [];
        
        // Procesar datos 1
        Object.keys(data1).forEach(station => {
            if (data1[station] && data1[station].length > 0) {
                data1[station].forEach(item => {
                    combinedData.push({ station: station, code: item.code, session: 1 });
                });
            }
        });

        // Procesar datos 2
        Object.keys(data2).forEach(station => {
            if (data2[station] && data2[station].length > 0) {
                data2[station].forEach(item => {
                    combinedData.push({ station: station, code: item.code, session: 2 });
                });
            }
        });

        renderTable();
    }

    function handleSearch() {
        searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        renderTable();
    }

    function toggleDuplicates() {
        showDuplicatesOnly = !showDuplicatesOnly;
        const btn = document.getElementById('btnDuplicates');
        
        if (showDuplicatesOnly) {
            btn.classList.add('active');
            btn.innerHTML = '📋 Ver Todos los Registros';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '⚠️ Mostrar Duplicados';
        }
        renderTable();
    }

    function deleteRecord(station, code, session) {
        if (confirm(`¿Estás seguro de eliminar el código ${code} de la ubicación ${station} (Sesión ${session})?`)) {
            const db = session === 1 ? db1 : db2;
            
            // Eliminar de stationsData (lo vacía como en tu lógica original)
            db.ref(`picking_live/stationsData/${station}`).set([]);
            
            // Eliminar de codeMap
            db.ref(`picking_live/codeMap/${code}`).remove();
        }
    }

    function deleteAllRecords() {
        if (confirm('⚠️ ¿Estás seguro de ELIMINAR TODOS los registros de AMBAS sesiones?')) {
            // Eliminar todos los datos de la sesión 1
            db1.ref('picking_live/stationsData').remove();
            db1.ref('picking_live/codeMap').remove();
            
            // Eliminar todos los datos de la sesión 2
            db2.ref('picking_live/stationsData').remove();
            db2.ref('picking_live/codeMap').remove();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        let renderList = combinedData;

        // Contar ocurrencias para detectar duplicados
        const codeCounts = {};
        let totalDuplicados = 0;
        
        combinedData.forEach(item => {
            codeCounts[item.code] = (codeCounts[item.code] || 0) + 1;
        });

        // Contabilizar el total real de códigos duplicados
        combinedData.forEach(item => {
            if(codeCounts[item.code] > 1) {
                totalDuplicados++;
            }
        });

        // Actualizar mini contador en la cabecera
        const statsCounter = document.getElementById('statsCounter');
        if(statsCounter) {
            statsCounter.innerHTML = `Registros: <span style="color: white;">${combinedData.length}</span> &nbsp;|&nbsp; Duplicados: <span style="color: var(--danger);">${totalDuplicados}</span>`;
        }

        // Filtrar por búsqueda
        if (searchTerm) {
            renderList = renderList.filter(item => 
                item.code.toLowerCase().includes(searchTerm) || 
                item.station.toLowerCase().includes(searchTerm)
            );
        }

        // Filtrar por duplicados si está activo
        if (showDuplicatesOnly) {
            renderList = renderList.filter(item => codeCounts[item.code] > 1);
            // Agrupar (ordenar) por código para optimizar la vista
            renderList.sort((a, b) => a.code.localeCompare(b.code));
        }

        if (renderList.length === 0) {
            tbody.innerHTML = `<div style="padding: 20px; text-align: center; color: #94a3b8;">No se encontraron registros.</div>`;
            return;
        }

        // Renderizar filas
        renderList.forEach(item => {
            const isDuplicate = codeCounts[item.code] > 1;
            const rowClass = isDuplicate ? 'data-row duplicated' : 'data-row';
            const badgeClass = item.session === 1 ? 'badge-s1' : 'badge-s2';
            
            const row = document.createElement('div');
            row.className = rowClass;
            row.innerHTML = `
                <div><b>${item.station}</b></div>
                <div style="font-family:monospace; color:var(--accent); font-size: 1.05rem;">${item.code}</div>
                <div><span class="${badgeClass}">Sesión #${item.session}</span></div>
                <div>
                    <button class="btn-del" onclick="deleteRecord('${item.station}', '${item.code}', ${item.session})">
                        X Eliminar
                    </button>
                </div>
            `;
            tbody.appendChild(row);
        });
    }

    function exportToExcel() {
        if (combinedData.length === 0) {
            alert("No hay datos para exportar.");
            return;
        }
        
        let exportData = combinedData.map(item => ({
            "Ubicación": item.station,
            "Código": item.code,
            "Archivo Origen": `Sesión ${item.session}`
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new(); 
        XLSX.utils.book_append_sheet(wb, ws, "Consolidado"); 
        XLSX.writeFile(wb, "Reporte_Consolidado_Picking.xlsx");
    }
</script>
</body>
</html>
